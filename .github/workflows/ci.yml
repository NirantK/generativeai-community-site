name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Admissions checks
        run: |
          cp admissions/.dev.vars.example admissions/.dev.vars
          npm run check:admissions
          npm run test:admissions
          npm run build:admissions
      - name: Local job database
        run: npx wrangler d1 migrations apply genai_jobboard --local
      - name: Build
        run: npm run build
      - name: Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
